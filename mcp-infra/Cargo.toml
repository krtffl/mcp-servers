[package]
name = "mcp-infra"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server exposing self-hosted infrastructure metrics (Prometheus, Docker, server health)"

[[bin]]
name = "mcp-infra"
path = "src/main.rs"

[dependencies]
mcp-common = { path = "../mcp-common" }
rmcp = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
bollard = { version = "0.18", default-features = false, features = ["rustls"] }
sysinfo = "0.33"
dirs = "6"

[lints]
workspace = true
